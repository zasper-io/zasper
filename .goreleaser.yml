project_name: zasper

version: 2

before:
  hooks:
    - go mod tidy
    # ui/build is not in git and spa.go embeds it, so the frontend has to exist before the Go build.
    - npm --prefix ./ui ci
    - env CI=false npm --prefix ./ui run build

builds:
  - id: zasper
    env:
      - CGO_ENABLED=0
    main: .
    ldflags:
      # {{.Version}} is the tag with its v stripped, so a released binary reports 1.0.0 — the same
      # string `make build` produces from version.txt. It used to be the raw tag name, which meant
      # releases said v1.0.0 and source builds said 1.0.0.
      - -s -w
      - -X main.version={{.Version}}
      # Empty when the secret is not configured, which the analytics package treats as "use the
      # built-in key" rather than as "send nothing".
      - -X github.com/zasper-io/zasper/internal/analytics.injectedPHAPIKey={{.Env.POSTHOG_API_KEY}}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_386
      - linux_amd64
      - linux_arm64
      - windows_386
      - windows_amd64
      - windows_arm64

notarize:
  macos:
    # Not isEnvSet: Actions defines a missing secret as an empty string, so presence alone was true
    # even with no certificate, and notarization then failed the whole release.
    - enabled: '{{ if .Env.MACOS_SIGN_P12 }}true{{ else }}false{{ end }}'
      sign:
        certificate: "{{.Env.MACOS_SIGN_P12}}"
        password: "{{.Env.MACOS_SIGN_PASSWORD}}"
        entitlements: ./resources/entitlements.mac.plist
      notarize:
        issuer_id: "{{.Env.MACOS_NOTARY_ISSUER_ID}}"
        key_id: "{{.Env.MACOS_NOTARY_KEY_ID}}"
        key: "{{.Env.MACOS_NOTARY_KEY}}"
        wait: true
        # 20m is the ceiling; Apple rejects an authentication token with a longer lifetime, and
        # `goreleaser check` refuses the config outright above it.
        timeout: 20m

archives:
  - id: archive
    # `builds` was renamed to `ids` in GoReleaser 2.5 and is a hard error in v3.
    ids:
      - zasper
    files:
      - LICENSE
      - README.md
      - PRIVACY.md
    # The version is in the name so a downloaded tarball can still say which build it is.
    name_template: >-
      {{ .ProjectName }}-webapp-{{ .Version }}-{{ .Os }}-{{ .Arch }}
    format_overrides:
      - goos: windows
        formats:
          - zip

# homebrew_casks, not brews: brews is deprecated and removed in GoReleaser v3. A cask is the right
# shape here anyway, since this ships a prebuilt notarized binary rather than building from source.
homebrew_casks:
  - name: zasper
    repository:
      owner: zasper-io
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: "https://zasper.io"
    description: "High Performance IDE for Jupyter Notebooks"
    license: "AGPL-3.0"
    # auto = skip when the tag is a pre-release, so cutting v1.0.0-rc.1 to rehearse the pipeline does
    # not put a release candidate in front of every `brew install zasper`.
    skip_upload: auto
    # Zasper runs notebooks on Jupyter kernels but does not install one; ipykernel comes from pip.
    caveats: |
      Zasper needs a Jupyter kernel to run notebooks:
        pip install ipykernel

release:
  # A 1.0.0 tag is the first stable release; anything carrying a -beta/-rc suffix is marked as a
  # pre-release rather than published as stable, which is what happened to v0.3.0-beta.
  prerelease: auto
  # The Homebrew cask is published after the GitHub Release, so a re-run following a cask failure
  # finds this release's archives already uploaded. Replacing them lets the re-run finish instead of
  # failing on its own earlier upload.
  replace_existing_artifacts: true
