<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="title">Zasper architecture</title>
  <desc id="desc">The browser talks to the zasper binary over HTTP and WebSocket. Inside the binary, an HTTP router with JWT authentication dispatches to the kernel and session manager, kernelspec discovery, contents, git and terminals. Jupyter kernels run as separate processes reached over ZeroMQ, contents and git work on the project directory, and terminals drive shell processes through a PTY.</desc>
  <style>
    .bg { fill: #ffffff; }
    .box { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1; }
    .bin { fill: #eaf5f4; stroke: #0c6862; stroke-width: 1.5; }
    .inner { fill: #ffffff; stroke: #a3d5d1; stroke-width: 1; }
    .pill { fill: #ffffff; stroke: #d0d7de; stroke-width: 1; }
    .title { fill: #0c6862; font-size: 20px; font-weight: 700; }
    .h { fill: #1f2328; font-size: 15px; font-weight: 600; }
    .sub { fill: #59636e; font-size: 11.5px; }
    .pt { fill: #1f2328; font-size: 12.5px; }
    .lab { fill: #0a5651; font-size: 11px; font-weight: 600; }
    .labm { fill: #59636e; font-size: 10.5px; }
    .wire { stroke: #6e7781; stroke-width: 1.5; fill: none; }
    .dash { stroke-dasharray: 5 4; }
    .head { fill: #6e7781; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .box { fill: #161b22; stroke: #30363d; }
      .bin { fill: #0b2a28; stroke: #2c8f88; }
      .inner { fill: #0d1117; stroke: #127a73; }
      .pill { fill: #0d1117; stroke: #30363d; }
      .title { fill: #a3d5d1; }
      .h, .pt { fill: #e6edf3; }
      .sub, .labm { fill: #9198a1; }
      .lab { fill: #a3d5d1; }
      .wire { stroke: #8b949e; }
      .head { fill: #8b949e; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" class="head"/>
    </marker>
  </defs>

  <rect class="bg" width="1200" height="640" rx="12"/>

  <rect class="box" x="40" y="190" width="200" height="276" rx="10"/>
  <text class="h" x="140" y="224" text-anchor="middle">Browser</text>
  <text class="sub" x="140" y="244" text-anchor="middle">Zasper UI · React, TypeScript</text>
  <rect class="pill" x="58" y="264" width="164" height="28" rx="6"/>
  <text class="pt" x="140" y="282.5" text-anchor="middle">Notebooks</text>
  <rect class="pill" x="58" y="300" width="164" height="28" rx="6"/>
  <text class="pt" x="140" y="318.5" text-anchor="middle">Editor</text>
  <rect class="pill" x="58" y="336" width="164" height="28" rx="6"/>
  <text class="pt" x="140" y="354.5" text-anchor="middle">Terminal</text>
  <rect class="pill" x="58" y="372" width="164" height="28" rx="6"/>
  <text class="pt" x="140" y="390.5" text-anchor="middle">Git</text>
  <rect class="pill" x="58" y="408" width="164" height="28" rx="6"/>
  <text class="pt" x="140" y="426.5" text-anchor="middle">Command palette</text>

  <rect class="bin" x="360" y="30" width="460" height="580" rx="14"/>
  <text x="384" y="66"><tspan class="title">zasper</tspan><tspan class="sub" dx="10">single Go binary</tspan></text>

  <rect class="inner" x="384" y="96" width="170" height="488" rx="10"/>
  <text class="h" x="469" y="252" text-anchor="middle">HTTP router</text>
  <text class="sub" x="469" y="272" text-anchor="middle">gorilla/mux</text>
  <rect class="pill" x="402" y="292" width="134" height="26" rx="6"/>
  <text class="pt" x="469" y="309.5" text-anchor="middle">JWT auth</text>
  <rect class="pill" x="402" y="326" width="134" height="26" rx="6"/>
  <text class="pt" x="469" y="343.5" text-anchor="middle">REST API</text>
  <rect class="pill" x="402" y="360" width="134" height="26" rx="6"/>
  <text class="pt" x="469" y="377.5" text-anchor="middle">WebSocket</text>
  <rect class="pill" x="402" y="394" width="134" height="26" rx="6"/>
  <text class="pt" x="469" y="411.5" text-anchor="middle">Embedded UI</text>

  <line class="wire" x1="242" y1="328" x2="382" y2="328" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text class="lab" x="301" y="318" text-anchor="middle">HTTP</text>
  <text class="lab" x="301" y="346" text-anchor="middle">WebSocket</text>

  <line class="wire" x1="554" y1="128" x2="592" y2="128"/>
  <line class="wire" x1="554" y1="204" x2="592" y2="204"/>
  <line class="wire" x1="554" y1="352" x2="592" y2="352"/>
  <line class="wire" x1="554" y1="428" x2="592" y2="428"/>
  <line class="wire" x1="554" y1="552" x2="592" y2="552"/>

  <rect class="inner" x="592" y="96" width="204" height="64" rx="10"/>
  <text class="h" x="694" y="122" text-anchor="middle">Kernels &amp; sessions</text>
  <text class="sub" x="694" y="142" text-anchor="middle">lifecycle · message routing</text>

  <rect class="inner" x="592" y="172" width="204" height="64" rx="10"/>
  <text class="h" x="694" y="198" text-anchor="middle">Kernelspecs</text>
  <text class="sub" x="694" y="218" text-anchor="middle">kernel discovery</text>

  <rect class="inner" x="592" y="320" width="204" height="64" rx="10"/>
  <text class="h" x="694" y="346" text-anchor="middle">Contents</text>
  <text class="sub" x="694" y="366" text-anchor="middle">files · notebooks · watch</text>

  <rect class="inner" x="592" y="396" width="204" height="64" rx="10"/>
  <text class="h" x="694" y="422" text-anchor="middle">Git</text>
  <text class="sub" x="694" y="442" text-anchor="middle">go-git</text>

  <rect class="inner" x="592" y="520" width="204" height="64" rx="10"/>
  <text class="h" x="694" y="546" text-anchor="middle">Terminals</text>
  <text class="sub" x="694" y="566" text-anchor="middle">pseudo-terminals</text>

  <line class="wire" x1="798" y1="128" x2="922" y2="128" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text class="lab" x="860" y="119" text-anchor="middle">ZeroMQ</text>
  <text class="labm" x="860" y="145" text-anchor="middle">shell, iopub, stdin,</text>
  <text class="labm" x="860" y="159" text-anchor="middle">control, heartbeat</text>

  <line class="wire dash" x1="798" y1="204" x2="922" y2="204" marker-end="url(#arrow)"/>
  <text class="labm" x="860" y="196" text-anchor="middle">reads kernel.json</text>

  <line class="wire" x1="798" y1="352" x2="922" y2="352" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text class="labm" x="860" y="344" text-anchor="middle">read · write · watch</text>

  <line class="wire" x1="798" y1="428" x2="922" y2="428" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text class="labm" x="860" y="420" text-anchor="middle">repository</text>

  <line class="wire" x1="798" y1="552" x2="922" y2="552" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text class="lab" x="860" y="544" text-anchor="middle">PTY</text>

  <rect class="box" x="924" y="80" width="236" height="236" rx="10"/>
  <text class="h" x="1042" y="108" text-anchor="middle">Jupyter kernels</text>
  <text class="sub" x="1042" y="128" text-anchor="middle">one process per kernel</text>
  <rect class="pill" x="942" y="144" width="200" height="34" rx="6"/>
  <text class="pt" x="1042" y="165.5" text-anchor="middle">Python · ipykernel</text>
  <rect class="pill" x="942" y="186" width="200" height="34" rx="6"/>
  <text class="pt" x="1042" y="207.5" text-anchor="middle">R · IRkernel</text>
  <rect class="pill" x="942" y="228" width="200" height="34" rx="6"/>
  <text class="pt" x="1042" y="249.5" text-anchor="middle">Julia · Deno · Go · …</text>
  <text class="sub" x="1042" y="294" text-anchor="middle">any Jupyter kernel</text>

  <rect class="box" x="924" y="336" width="236" height="116" rx="10"/>
  <text class="h" x="1042" y="388" text-anchor="middle">Project directory</text>
  <text class="sub" x="1042" y="408" text-anchor="middle">notebooks · files · .git</text>

  <rect class="box" x="924" y="520" width="236" height="64" rx="10"/>
  <text class="h" x="1042" y="546" text-anchor="middle">Shell processes</text>
  <text class="sub" x="1042" y="566" text-anchor="middle">one per terminal</text>
</svg>
