name: Zasper dependency policy
description: |
  Fails when a dependency has a known critical or high severity vulnerability,
  or carries one of the GPL licence identifiers below.
tags:
  - zasper
filters:
  - name: severe-vulnerability
    check_type: CheckTypeVulnerability
    summary: A dependency has a critical or high severity vulnerability
    value: |
      vulns.critical.size() > 0 || vulns.high.size() > 0
  - name: gpl-licence
    check_type: CheckTypeLicense
    summary: A dependency is GPL-licensed
    value: |
      licenses.exists(p, p in [
        "GPL-2.0", "GPL-2.0-only", "GPL-3.0", "GPL-3.0-only", "BSD-3-Clause OR GPL-2.0"
      ])
