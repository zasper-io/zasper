name: Dependency vetting

on:
  push:
    branches: [main]
  pull_request:

# vet posts what it finds as a comment on the pull request.
permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  vet:
    name: safedep vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: safedep/vet-action@e2a78850eb517b8305b1085bca947bef29213a22 # v1
        with:
          policy: .github/vet/policy.yml
          enable-comments-proxy: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
