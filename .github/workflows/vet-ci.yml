name: Dependency vetting

on:
  push:
    branches: [main]
  pull_request:

# vet posts what it finds as a comment on the pull request.
permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  vet:
    name: safedep vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: safedep/vet-action@v1
        with:
          policy: .github/vet/policy.yml
          enable-comments-proxy: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
