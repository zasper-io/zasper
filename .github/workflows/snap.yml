name: Build and Publish Snap (multi-arch)

on:
  push:
    # Was 'none*', which matched nothing — the snap has not been built by CI since that was set, and
    # PUBLISHING.md claimed it was handled here.
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Snapcraft
        uses: snapcore/action-build@v1
        id: build
        with:
          build-for: ${{ matrix.arch }}

      # A pre-release tag goes to the candidate channel. Without this, cutting v1.0.0-rc.1 to rehearse
      # the release would publish a release candidate to everyone tracking stable.
      - name: Choose the store channel
        id: channel
        run: |
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            echo "channel=candidate" >> "$GITHUB_OUTPUT"
          else
            echo "channel=stable" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload Snap to Snap Store
        env:
          # snapcraft 7 removed `login --with`. Credentials come from the environment now, generated
          # with: snapcraft export-login --snaps=zasper \
          #   --acls package_access,package_push,package_update,package_release -
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        run: snapcraft upload "${{ steps.build.outputs.snap }}" --release=${{ steps.channel.outputs.channel }}
