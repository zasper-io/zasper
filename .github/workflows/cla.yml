name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

# pull_request_target runs with write access in this repository's context, so this job must never
# check out or run the pull request's code. The action only reads comments and records signatures.
permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    name: CLA
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request &&
       (github.event.comment.body == 'recheck' ||
        github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'))
    runs-on: ubuntu-latest
    steps:
      # v2.6.1, pinned by commit because the upstream repository is archived.
      - uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/zasper-io/zasper/blob/main/CLA.md
          path-to-signatures: signatures/v1/cla.json
          # Kept off main so each signature is not a commit there; must exist and stay unprotected.
          branch: cla-signatures
          allowlist: prasunanand,dependabot[bot]
