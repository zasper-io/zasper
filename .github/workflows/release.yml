name: Build and Release

on:
  push:
    # Only semver tags. It used to be '*', so any tag at all — a docs marker, a scratch tag — cut a
    # public release, and a non-semver one failed GoReleaser partway through.
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'
  # Lets the verify job be run by hand from any branch, so the release gates can be proven before a
  # tag exists. The release job below is skipped unless the trigger really was a tag.
  workflow_dispatch:
  # Releases go through a pull request, so the release gates run on it: a PR that bumps the version
  # cannot merge with a broken .goreleaser.yml or a failing gate. Limited to the files that can break
  # a release, which every release PR touches through version.txt. Nothing is published from a PR.
  pull_request:
    branches: [main]
    paths:
      - 'version.txt'
      - 'CHANGELOG.md'
      - '.goreleaser.yml'
      - '.github/workflows/release.yml'
      - '.github/workflows/snap.yml'
      - 'snap/**'
      - 'docker/**'
      - 'scripts/sync-version.mjs'
      - 'Makefile'
      - 'go.mod'
      - 'go.sum'
      - 'ui/package.json'
      - 'ui/package-lock.json'

# Read-only by default, now that pull requests run this workflow; only the release job, which only
# ever runs on a tag, is given write access.
permissions:
  contents: read

jobs:
  # Nothing else in this repo runs on a tag: every other workflow is scoped to branches: [main]. So
  # without this job a release ships whatever the tag points at, untested.
  verify:
    name: Test before releasing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The tag is pushed by hand after the release PR merges, so nothing else ties it to the version
      # that was reviewed. A v1.0.1 tag on a commit whose version.txt says 1.0.0 would ship binaries
      # calling themselves 1.0.1 beside a snap and README calling themselves 1.0.0.
      - name: The tag matches version.txt
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tagged="${GITHUB_REF_NAME#v}"
          reviewed="$(tr -d '[:space:]' < version.txt)"
          if [ "$tagged" != "$reviewed" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version.txt ($reviewed). Tag the merged release commit on main."
            exit 1
          fi

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.12'

      - name: Install frontend dependencies
        run: npm --prefix ./ui ci

      - name: Typecheck and lint the frontend
        run: |
          npm --prefix ./ui run typecheck
          npm --prefix ./ui exec eslint src

      - name: Test the frontend
        run: npm --prefix ./ui run test

      - name: Build
        run: go build -tags apiserver -v ./...

      # -race: several tests are about two requests racing for the same kernel or session, and
      # without it they pass whether or not the lock they are about is there.
      - name: Test
        run: go test -race -tags apiserver ./...

      - name: Validate the release config
        uses: goreleaser/goreleaser-action@v6
        with:
          version: '~> v2'
          args: check

  release:
    name: Build and Release Go Binary with GoReleaser
    needs: verify
    # Only on a tag. A pull request or a workflow_dispatch is a rehearsal, never a publish.
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    runs-on: ubuntu-latest
    env:
      MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
      MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
      MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
      MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
      MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # GoReleaser reads the tag history to work out the version and the previous tag; the
          # default shallow clone leaves it guessing.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # Matches the toolchain in go.mod. It was 1.24 while go.mod asked for 1.25, which only
          # worked because GOTOOLCHAIN=auto silently downloaded the difference.
          go-version: '1.25'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.12'

      - name: Build and Release Go Binary with GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: '~> v2'
          args: release --clean
