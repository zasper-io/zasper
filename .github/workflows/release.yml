name: Build and Release

on:
  push:
    # Only semver tags. It used to be '*', so any tag at all — a docs marker, a scratch tag — cut a
    # public release, and a non-semver one failed GoReleaser partway through.
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'
  # Lets the verify job be run by hand from any branch, so the release gates can be proven before a
  # tag exists. The release job below is skipped unless the trigger really was a tag.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Nothing else in this repo runs on a tag: every other workflow is scoped to branches: [main]. So
  # without this job a release ships whatever the tag points at, untested.
  verify:
    name: Test before releasing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.7'

      - name: Install frontend dependencies
        run: npm --prefix ./ui ci

      - name: Typecheck and lint the frontend
        run: |
          npm --prefix ./ui run typecheck
          npm --prefix ./ui exec eslint src

      - name: Test the frontend
        run: npm --prefix ./ui run test

      - name: Build
        run: go build -tags apiserver -v ./...

      # -race: several tests are about two requests racing for the same kernel or session, and
      # without it they pass whether or not the lock they are about is there.
      - name: Test
        run: go test -race -tags apiserver ./...

      - name: Validate the release config
        uses: goreleaser/goreleaser-action@v6
        with:
          version: '~> v2'
          args: check

  release:
    name: Build and Release Go Binary with GoReleaser
    needs: verify
    # Never on a manual run: a workflow_dispatch is a rehearsal, not a publish.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    env:
      MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
      MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
      MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
      MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
      MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # GoReleaser reads the tag history to work out the version and the previous tag; the
          # default shallow clone leaves it guessing.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # Matches the toolchain in go.mod. It was 1.24 while go.mod asked for 1.25, which only
          # worked because GOTOOLCHAIN=auto silently downloaded the difference.
          go-version: '1.25'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.7'

      - name: Build and Release Go Binary with GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: '~> v2'
          args: release --clean
