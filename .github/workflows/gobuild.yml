# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

    - name: Set up Go
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
      with:
        go-version: '1.26'

    # GoReleaser used to run `go mod tidy` before building, so a release could be built from a go.mod that
    # was not the one reviewed. The check is here instead.
    - name: go.mod is tidy
      run: go mod tidy -diff

    - name: Build
      run: go build -tags apiserver -v ./...

    # -race: several tests are about two requests racing for the same kernel or session, and without
    # it they pass whether or not the lock they are about is there. internal/server is left to the API
    # journeys in e2e.yml, which run it against a real kernel.
    - name: Test
      run: go test -race -tags apiserver -v $(go list -tags apiserver ./... | grep -v /internal/server)

  other-platforms:
    name: Go on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

    - name: Set up Go
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
      with:
        go-version: '1.26'

    - name: Vet
      run: go vet -tags apiserver ./...

    - name: Test
      if: runner.os != 'Windows'
      run: go test -race -tags apiserver ./...

    # Not gating yet: nothing had run the Go tests on Windows before, which has no terminal (ConPTY) and
    # interrupts a kernel differently. The tests that need either skip themselves; make this gate once
    # it has been green. No -race, which needs cgo, and no internal/server, whose journeys use sh.
    - name: Test (Windows, not gating yet)
      if: runner.os == 'Windows'
      continue-on-error: true
      shell: bash
      run: go test -tags apiserver $(go list -tags apiserver ./... | grep -v /internal/server)

  govulncheck:
    name: Known vulnerabilities
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

    # govulncheck v1.8.0 has to be built with a newer Go than the 1.26 Zasper builds with.
    - name: Set up Go
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
      with:
        go-version: stable

    - name: govulncheck
      run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 -tags apiserver ./...
