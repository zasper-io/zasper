# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.24'

    - name: Build
      run: go build -tags apiserver -v ./...

    # -race: several tests are about two requests racing for the same kernel or session, and without
    # it they pass whether or not the lock they are about is there.
    - name: Test
      run: go test -race -tags apiserver -v ./...
