# End-to-end tests: the two halves of the app against each other, which none of the other workflows
# cover. Two jobs, because most of the value needs no browser and no frontend build — the api job is
# the one that fails first when a route or a kernel contract breaks.
name: End-to-end tests

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

jobs:
  api-e2e:
    name: API journeys
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.26'

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      # A real kernel, so the session and websocket journeys run rather than skip. The tests skip
      # when no kernelspec has a runnable interpreter, and a skipped suite proves nothing.
      - name: Install a Jupyter kernel
        run: |
          python -m pip install --upgrade pip
          python -m pip install ipykernel
          python -m ipykernel install --user --name ci --display-name "CI Python"

      # -race because these journeys include two concurrent deletes of the same session; without it
      # the test passes whether or not the lock it is about is there.
      - name: Run the API journeys
        run: go test -race -tags apiserver -v ./internal/server/...

  # One kernel from each family, so a kernel that is not ipykernel is started, run, interrupted and
  # stopped somewhere. Julia is the one family not installed here. Ruby is the slowest, about 80s,
  # until a kernel with no control socket stops stalling its first run.
  kernel-families:
    name: Kernel families
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.26'

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install the Python and Bash kernels
        run: |
          python -m pip install --upgrade pip
          python -m pip install ipykernel bash_kernel
          python -m ipykernel install --user --name ci --display-name "CI Python"
          python -m bash_kernel.install --user

      # IRkernel's kernelspec runs a bare `R`, so the test step runs inside this environment.
      - name: Install the R and C++ kernels
        uses: mamba-org/setup-micromamba@f457c30a868e4760d3a6fcea5f25dc655b8edf39 # v3.2.1
        with:
          environment-name: kernels
          create-args: r-irkernel xeus-cpp
          condarc: |
            channels: [conda-forge]
          cache-environment: true
          init-shell: bash

      - name: Install the Deno kernel
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      - run: deno jupyter --install

      # setup-go has put $GOPATH/bin on PATH, where gonb looks for goimports and gopls.
      - name: Install the Go kernel
        run: |
          go install github.com/janpfeifer/gonb@v0.11.5
          go install golang.org/x/tools/cmd/goimports@v0.52.0
          go install golang.org/x/tools/gopls@v0.23.0
          gonb --install

      - name: Set up Ruby
        uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: '3.4'

      - name: Install the Ruby kernel
        run: |
          # ffi-rzmq loads libzmq.so, which only the -dev package links.
          sudo apt-get install -y libzmq3-dev
          gem install iruby
          iruby register --force

      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Coursier
        uses: coursier/setup-action@648df969f41ef15fda2baba8b37f9fa3d16390a3 # v3.0.4

      # Almond is interrupted by message, not SIGINT, but its kernelspec does not say so.
      - name: Install the Scala kernel
        run: |
          cs launch --use-bootstrap almond --scala 2.13 -- --install --id scala --display-name Scala
          spec=~/.local/share/jupyter/kernels/scala/kernel.json
          jq '.interrupt_mode = "message"' "$spec" > "$spec.tmp" && mv "$spec.tmp" "$spec"

      - name: Run the kernel smoke tests
        shell: bash -el {0}
        run: |
          set -o pipefail
          export JUPYTER_PATH="$MAMBA_ROOT_PREFIX/envs/kernels/share/jupyter"
          go test -tags apiserver -v -run TestEveryKernelFamilyRunsAndStops ./internal/server/ | tee families.log
          # The test skips a family it cannot find, which here means an install went wrong.
          ! grep -- '--- SKIP' families.log | grep -v /julia

  browser-e2e:
    name: Browser journeys
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.26'

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.12'

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install a Jupyter kernel
        run: |
          python -m pip install --upgrade pip
          python -m pip install ipykernel
          python -m ipykernel install --user --name ci --display-name "CI Python"

      - name: Install the frontend dependencies
        run: make init

      # The server embeds ui/build, so this has to come before anything starts it. The suite builds
      # the binary itself (e2e/prepare.cjs), deliberately without -tags apiserver.
      - name: Build the frontend
        run: cd ui && npm run build

      - name: Install Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run the browser journeys
        working-directory: e2e
        run: npx playwright test

      # Only on failure, and this is the whole point of trace: 'retain-on-failure' — a CI failure in a
      # browser is unreadable from a log line, and openable from a trace.
      - name: Upload the report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 7
