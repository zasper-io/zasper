# End-to-end tests: the two halves of the app against each other, which none of the other workflows
# cover. Two jobs, because most of the value needs no browser and no frontend build — the api job is
# the one that fails first when a route or a kernel contract breaks.
name: End-to-end tests

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

jobs:
  api-e2e:
    name: API journeys
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.26'

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      # A real kernel, so the session and websocket journeys run rather than skip. The tests skip
      # when no kernelspec has a runnable interpreter, and a skipped suite proves nothing.
      - name: Install a Jupyter kernel
        run: |
          python -m pip install --upgrade pip
          python -m pip install ipykernel
          python -m ipykernel install --user --name ci --display-name "CI Python"

      # -race because these journeys include two concurrent deletes of the same session; without it
      # the test passes whether or not the lock it is about is there.
      - name: Run the API journeys
        run: go test -race -tags apiserver -v ./internal/server/...

  browser-e2e:
    name: Browser journeys
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.26'

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.12'

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install a Jupyter kernel
        run: |
          python -m pip install --upgrade pip
          python -m pip install ipykernel
          python -m ipykernel install --user --name ci --display-name "CI Python"

      - name: Install the frontend dependencies
        run: make init

      # The server embeds ui/build, so this has to come before anything starts it. The suite builds
      # the binary itself (e2e/prepare.cjs), deliberately without -tags apiserver.
      - name: Build the frontend
        run: cd ui && npm run build

      - name: Install Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run the browser journeys
        working-directory: e2e
        run: npx playwright test

      # Only on failure, and this is the whole point of trace: 'retain-on-failure' — a CI failure in a
      # browser is unreadable from a log line, and openable from a trace.
      - name: Upload the report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 7
