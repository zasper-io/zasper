name: Frontend tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  vitest:
    name: Vitest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12'
      - run: make init
      # The frontend half only: the Go tests are Go Build's job, and `make test` now runs both.
      - run: make test-frontend
