<!-- The app's own mark as a favicon, ui/public/images/logo-icon.svg, recoloured for the teal accent.

     A port and not a redraw: same viewBox, same layers, same path data, so every hue and the file the
     app ships differ only in colour. Generated by one script for all four accents, from the ramp in
     css/accents.css, so no hue is hand-tuned against the others.

       #443e5f bolt -> #2e4745   (the bolt stays white; the disc takes #0c6862 on a #063733 square)
     The two greys are matched on *contrast* rather than on lightness — same saturation as the purple
     they replace, and the lightness that lands on the same ratio against white. Copying the lightness
     instead makes the wordmark read a full step darker in slate than in teal, because a hue's
     luminance is not a function of its lightness alone.

     Fixed colours, deliberately: a mark that changes hue with the theme switcher is not a mark. The
     prototype picks the file for the accent being previewed; the file itself does not follow anything.
 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-6.279999999999998 0 54.08 54.08"><rect x="-6.279999999999998" y="0" width="54.08" height="54.08" rx="11" fill="#063733"/><g transform="translate(-521.699 -403.972)"><circle fill="#0c6862" cx="20.262" cy="20.262" r="20.262" transform="translate(522.199 409.836)"/><g transform="translate(527.093 405.794)"><path fill="#2e4745" d="M530.922,403.972l29.034,23.688L546.11,433.4l11.932,22.826-30.036-23.995,14.905-6.337Z" transform="translate(-528.006 -403.972)"/><path fill="#2e4745" d="M558.042,466.243l-30.036-23.995,18.1,1.169Z" transform="translate(-528.006 -413.992)"/><path fill="#2e4745" d="M528.006,440l18.1,1.169,13.846-5.737-17.045-1.768Z" transform="translate(-528.006 -411.745)"/><path fill="#2e4745" d="M560.99,427.661l-17.045-1.768-11.989-21.92Z" transform="translate(-529.04 -403.972)"/></g><g transform="translate(526.484 403.972)"><path fill="#fff" d="M530.922,403.972l29.034,23.688L546.11,433.4l11.932,22.826-30.036-23.995,14.905-6.337Z" transform="translate(-528.004 -403.972)"/><path fill="#fff" d="M0,28.256l14.906-6.336,17.046,1.768L18.1,29.426,30.038,52.251Zm14.908-6.336L2.918,0,31.951,23.689Z" transform="translate(0)"/></g></g></svg>